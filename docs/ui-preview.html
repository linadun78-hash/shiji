      },
    };
    const previewParams = new URLSearchParams(window.location.search);
    const cloudAccountPreview = previewParams.get('account') === 'cloud';
    const tutorialReportPreview = previewParams.get('report') === 'tutorial';
    if (tutorialReportPreview) {
      previewStore.xhsCollectorState.tasks[0].name = '桌面应用安装教程';

        title: '安装前先确认系统与安装包',
        author: '软件入门指南',
        bodyText: '下载前确认操作系统版本，并从官方页面下载安装包。安装完成后应能从开始菜单启动应用。',

      Object.assign(previewStore.xhsCollectorState.materials[1], {
        title: '第一次启动与基础配置',
        author: '新手配置笔记',
        bodyText: '第一次启动时按界面提示选择保存位置。若应用无法启动，可重新核对系统版本与安装包来源。',
      });
      previewStore.xhsAnalysisState.records = [
        { materialId: 'm1', contentHash: 'v1-11111111', status: 'succeeded', brief: { oneLineSummary: '确认系统、安装包来源与安装后的成功表现。', evidence: [{ id: 'E1', quote: '下载前确认操作系统版本，并从官方页面下载安装包。' }] } },

      ];
      previewStore.xhsPurposeReportState.reports[0] = {
        taskId: 'task-1', status: 'succeeded', error: null, reportId: 'report-tutorial-preview', sourceRevision: 'rev-ui-1ae372f4',
        selectedMaterialIds: ['m1', 'm2'], reportPreset: 'tutorial', reportPresetSelection: 'tutorial', familiarityLevel: 'beginner', supplementMode: 'source_only',
        goal: '我什么都不会，想完成桌面应用安装', constraints: ['只按素材提供的步骤操作'],
        goalUnderstanding: '完成桌面应用的下载、安装与第一次启动。',
        executiveSummary: '先完成安装前确认，再按顺序安装并检查能否正常启动；素材没有说明的内容保留为待核实项。',
        preflightActions: [{
          title: '确认安装包', purpose: '避免下载不适用于当前电脑的文件。',

    let previewAuthenticated = true;
    window.chrome = {
      runtime: {
        lastError: null,
        getURL: (path) => `../${path}`,
        sendMessage: async (message) => {
          if (message.type === 'XMC_GET_AUTH_STATUS') return cloudAccountPreview
            ? { ok: true, status: { mode: 'cloud', authenticated: previewAuthenticated, account: previewAuthenticated ? { id: 'auth0|preview', name: '旅行测试用户', email: 'traveler@example.com', picture: '' } : null } }

          if (message.type === 'XMC_AUTH_SIGN_IN') {
            previewAuthenticated = true;
            return { ok: true, status: { mode: 'cloud', authenticated: true, account: { id: 'auth0|preview', name: '旅行测试用户', email: 'traveler@example.com', picture: '' } } };
          }
          if (message.type === 'XMC_AUTH_SIGN_OUT') {
            previewAuthenticated = false;
            return { ok: true, status: { mode: 'cloud', authenticated: false, account: null } };
          }
          if (message.type === 'XMC_GET_SETTINGS') return { ok: true, settings: { configured: true, baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat', hasApiKey: true } };
          return { ok: true };
        },
      },
      storage: {
        local: {
          get: (key, callback) => callback({ [key]: previewStore[key] }),
          set: (values, callback) => { Object.assign(previewStore, values); callback(); },
        },
        onChanged: { addListener: () => undefined },
      },
    };
    const previewSendMessage = window.chrome.runtime.sendMessage;
    window.chrome.runtime.sendMessage = (message, callback) => {
      const result = previewSendMessage(message);
      Promise.resolve(result).then((value) => callback?.(value));
      return result;
    };

  <script src="../src/provider-presets.js"></script>
  <script src="../src/ui-model.js"></script>

    window.setTimeout(() => {
      document.querySelector('.xmc-dock')?.click();
      if (cloudAccountPreview) document.querySelector('.xmc-settings-toggle')?.click();
      else {
        document.querySelector('[data-view="report"]')?.click();
        if (tutorialReportPreview) document.querySelector('[data-report-step="3"]')?.click();
      }
    }, 100);
